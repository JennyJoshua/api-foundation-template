name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate and commit npm lockfile
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "build: add npm dependency lockfile"
              git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            fi
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Capture dependency audit report
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-reports
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Run lint, typecheck, tests and build
        run: npm run check
