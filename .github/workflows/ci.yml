name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Capture dependency audit report
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report and generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-reports
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Run lint, typecheck, tests and build
        run: npm run check
